# motor-ctrl — COARSE SCOPED config (config-only scoping).
#
# Companion to archeon.example.toml, showing the narrowed-scope variant.
#
# Rationale: the default whole-component scope tends to sweep in vendored
# thirdparty/ and generated binding code, which dominates the symbol graph and
# collapses clustering into a few meaningless mega-clusters. This variant
# narrows path_prefixes to where the what-layer actually lives:
#
#   modules/<mod>/src/                  behavior/logic (state transitions,
#                                       thresholds, conditional rules)
#   modules/<mod>/include/              hand-written headers / contracts
#   modules/<mod>/generated/public/cpp/ domain data model: enums, states,
#                                       configs WITH doc comments. Where there
#                                       is no IDL source in-repo, these
#                                       generated headers are the most
#                                       authoritative concise declaration.
#
# Excluded: thirdparty/, generated bindings (JNI/objc), tests/, samples/,
# tools/, platform/ glue.
#
# NOTE: generated/public/cpp/ still drags in mechanical toCpp/toJava .cpp
# converters by directory prefix, but the `exclude` glob below removes them.
#
# Writes to its own DB so it does not clobber the full-scope motor-ctrl.db.

[component]
name = "motor-ctrl"
db = "motor-ctrl-scoped.db"
repo_path = "/work/monorepo"
path_prefixes = [
  # base — infrastructure (interface plumbing); no generated/public/cpp
  "projects/motor-ctrl/modules/base/src/",
  "projects/motor-ctrl/modules/base/include/",
  # motor
  "projects/motor-ctrl/modules/motor/src/",
  "projects/motor-ctrl/modules/motor/include/",
  "projects/motor-ctrl/modules/motor/generated/public/cpp/",
  # sdk
  "projects/motor-ctrl/modules/sdk/src/",
  "projects/motor-ctrl/modules/sdk/include/",
  "projects/motor-ctrl/modules/sdk/generated/public/cpp/",
]
# Glob exclude (scan include/exclude filters, py>=3.13). Drops the mechanical
# toCpp/toJava converter .cpp files that generated/public/cpp/ otherwise drags
# in, plus defense-in-depth against vendored/test leakage.
exclude = [
  "**/generated/**/*.cpp",
  "**/thirdparty/**",
  "**/tests/**",
]
# No compile_commands.json (project isn't built locally) — scan falls back
# to tree-sitter automatically. Re-add this once you've run `cmake --build`:
# compile_db_dir = "/work/monorepo/projects/motor-ctrl/build"

[git]
exclude_authors = ["dependabot[bot]", "dependabot-preview[bot]", "renovate[bot]",
                   "github-actions[bot]", "mergify[bot]", "internal-ci"]

[jira]
base_url = "https://jira.internal.example"
project_keys = ["MOT", "EMB", "PWR"]

[prs]
repo = "org/monorepo"

[wiki]
export_dir = "/work/monorepo/projects/motor-ctrl/confluence_export"

[llm]
cheap_model = "claude-haiku-4-5-20251001"
expensive_model = "claude-sonnet-5"
max_commits = 200

# Embedding model: defaults to qwen3-embedding:4b (primary). To use the smaller
# CI fallback (dims match at 1024), uncomment:
# [retrieval]
# embed_model = "qwen3-embedding:0.6b"
# embed_dims = 1024
